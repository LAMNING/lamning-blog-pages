<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LAMNING - 课程表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;color:#1a1a2e;min-height:100vh;overflow-x:hidden}
.animated-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;background:linear-gradient(135deg,#dbeafe 0%,#e0e7ff 20%,#cffafe 40%,#ede9fe 60%,#dbeafe 80%,#e0f2fe 100%);background-size:400% 400%;animation:gf 12s ease infinite}
@keyframes gf{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}


/* ===== 主内容 ===== */
.main-wrap{padding:24px 0 48px;opacity:0;transform:translateY(20px);transition:all .6s cubic-bezier(.22,1,.36,1)}
.main-wrap.visible{opacity:1;transform:translateY(0)}
.hero{text-align:center;padding:20px 0 16px}
.hero h1{font-size:26px;font-weight:700;color:#0f172a;margin-bottom:4px;background:linear-gradient(135deg,#0f172a,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero .sub{font-size:13px;color:#64748b}

/* 周切换 */
.week-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.week-info{display:flex;align-items:center;gap:10px}
.week-badge{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:999px;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#3b82f6,#6366f1);box-shadow:0 4px 15px rgba(59,130,246,.3);transition:all .3s}
.week-badge.not-current{background:linear-gradient(135deg,#94a3b8,#64748b);box-shadow:0 4px 15px rgba(100,116,139,.2)}
.week-nav{display:flex;align-items:center;gap:6px}
.wk-btn{width:36px;height:36px;border-radius:12px;border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.5);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:#475569;transition:all .2s}
.wk-btn:hover{background:rgba(59,130,246,.12);border-color:#3b82f6;transform:scale(1.08)}
.wk-btn:active{transform:scale(.95)}
.wk-select{padding:8px 14px;border:1px solid rgba(0,0,0,.08);border-radius:12px;background:rgba(255,255,255,.5);font-size:13px;color:#475569;outline:none;cursor:pointer;transition:all .2s}
.wk-select:hover{border-color:#3b82f6}
.course-count{font-size:12px;color:#94a3b8;background:rgba(255,255,255,.4);padding:4px 10px;border-radius:999px}

/* ===== 课表 ===== */
.sw{overflow-x:auto;perspective:1200px}
table{width:100%;border-collapse:separate;border-spacing:5px;min-width:700px}
th{padding:12px 8px;font-size:13px;font-weight:600;color:#475569;background:rgba(255,255,255,.5);border-radius:12px;transition:all .3s}
th:first-child{width:76px}
th.today{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;box-shadow:0 4px 15px rgba(59,130,246,.3);transform:scale(1.03)}
tr{height:88px}
td{padding:4px;vertical-align:top}
.tc{text-align:center;font-size:11px;color:#94a3b8;background:rgba(255,255,255,.35);border-radius:10px;padding:14px 4px}
.tn{font-size:15px;font-weight:700;color:#334155;display:block;margin-bottom:2px}

/* 课程卡片 */
.cc{padding:12px 12px;border-radius:14px;color:#fff;font-size:12px;line-height:1.6;transition:all .35s cubic-bezier(.22,1,.36,1);position:relative;overflow:hidden;cursor:default;animation:cardIn .5s cubic-bezier(.22,1,.36,1) backwards;display:flex;flex-direction:column;justify-content:center;gap:2px}
.cc:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 12px 30px rgba(0,0,0,.2);z-index:5}
.cc::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transition:left .5s}
.cc:hover::before{left:100%}
.cn{font-weight:700;font-size:13px;margin-bottom:3px;line-height:1.3}
.ci{opacity:.85;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px}
.es{background:rgba(255,255,255,.15);border:1px dashed rgba(0,0,0,.05);border-radius:12px;min-height:68px;transition:background .2s}
.es:hover{background:rgba(255,255,255,.3)}
@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
footer{text-align:center;padding:24px;font-size:12px;color:#94a3b8}

/* 移动端 */

/* ===== 密码验证 ===== */
.auth-overlay{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.3);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:opacity .4s,visibility .4s}
.auth-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
.auth-box{width:340px;padding:40px 36px;background:rgba(255,255,255,.75);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.8);border-radius:20px;box-shadow:0 16px 60px rgba(0,0,0,.1);text-align:center}
.auth-icon{font-size:40px;margin-bottom:16px}
.auth-title{font-size:22px;font-weight:700;color:#0f172a;margin-bottom:6px}
.auth-sub{font-size:13px;color:#94a3b8;margin-bottom:24px}
.auth-input{width:100%;padding:12px 16px;border:1.5px solid rgba(0,0,0,.1);border-radius:12px;font-size:15px;text-align:center;outline:none;background:rgba(255,255,255,.8);transition:border-color .2s;margin-bottom:14px;letter-spacing:4px}
.auth-input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.auth-btn{width:100%;padding:13px;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:all .25s}
.auth-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(59,130,246,.35)}
.auth-btn:active{transform:scale(.98)}
.auth-err{font-size:13px;color:#ef4444;margin-top:12px;display:none}
.auth-err.show{display:block}

.auth-hint{font-size:11px;color:#94a3b8;margin-top:6px;font-weight:400}
/* 今日状态建议 */
.day-tip{max-width:640px;margin:6px auto 0;display:flex;align-items:flex-start;gap:12px;text-align:left;background:rgba(255,255,255,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.7);border-radius:16px;padding:14px 18px;box-shadow:0 4px 20px rgba(0,0,0,.05);font-size:14px;color:#334155;line-height:1.7;animation:cardIn .5s ease backwards;animation-delay:.3s}
.tip-emoji{font-size:20px;flex-shrink:0;margin-top:1px}
.tip-body{flex:1;min-width:0}
.tip-body b{color:#0f172a;font-weight:700}
.tip-sub{font-size:12px;color:#64748b;margin-top:3px}
/* 列头今日小字 */
.today-tag{display:inline-block;font-size:9px;font-weight:700;color:#3b82f6;letter-spacing:1px;margin-top:2px;background:#fff;padding:1px 7px;border-radius:99px;box-shadow:0 1px 4px rgba(0,0,0,.15);line-height:1.4}
/* 参考日卡片 */
.cc.ref{outline:2px solid rgba(59,130,246,.45);outline-offset:-2px;box-shadow:0 0 14px rgba(59,130,246,.18)}
.ref-day-tag{display:inline-block;font-size:9px;font-weight:700;color:#3b82f6;background:rgba(59,130,246,.1);padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:1px}
/* 正在进行卡片：流动光带 */
.cc.live{box-shadow:0 0 0 1px rgba(255,255,255,.55),0 4px 18px rgba(0,0,0,.12)}
.cc.live::after{content:'';position:absolute;top:0;left:-50%;width:35%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.25),transparent);transform:skewX(-18deg);animation:ccShine 2.4s ease-in-out infinite;pointer-events:none}
@keyframes ccShine{0%{left:-50%}55%,100%{left:120%}}
.live-tag{position:absolute;top:6px;right:6px;font-size:9px;font-weight:700;color:#fff;background:rgba(16,185,129,.92);padding:1px 7px;border-radius:99px;box-shadow:0 1px 4px rgba(0,0,0,.15);letter-spacing:.5px;animation:livePulse 1.8s ease-in-out infinite}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.6}}
@media(max-width:768px){
  table{min-width:580px}
  .cc{padding:8px;font-size:11px;border-radius:10px}
  .cn{font-size:12px}
  .hero h1{font-size:22px}
  .auth-box{width:300px;padding:32px 28px}
}
</style>

/* 学期第1周周一 = 2026-08-31，周数按日期自动计算 */
var TERM_START_MONDAY = new Date(2026, 7, 31);
function calcWeekOf(dt) {
  var d = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
  var dow = d.getDay() === 0 ? 7 : d.getDay();
  d.setDate(d.getDate() - dow + 1);
  var days = Math.round((d - TERM_START_MONDAY) / 86400000);
  var w = Math.floor(days / 7) + 1;
  if (w < 1) w = 1;
  if (w > 24) w = 24;
  return w;
}

/* ===== 今日状态建议 ===== */
var DAY_NAMES = ['','周一','周二','周三','周四','周五','周六','周日'];
var SLOT_TIMES = [{s:'08:20',e:'09:55'},{s:'10:15',e:'11:50'},{s:'14:00',e:'15:35'},{s:'15:55',e:'17:30'},{s:'19:00',e:'20:40'}];
function toMin(t){ var p = t.split(':'); return parseInt(p[0])*60 + parseInt(p[1]); }
function fmtDur(m){
  if (m < 60) return m + ' 分钟';
  var h = Math.floor(m / 60), mm = m % 60;
  return mm > 0 ? (h + ' 小时 ' + mm + ' 分钟') : (h + ' 小时');
}
function getDayCourses(grid, dow) {
  var res = [], occ = {};
  for (var s = 0; s < 5; s++) {
    if (occ[s]) continue;
    var items = grid[s + '_' + dow] || [];
    if (items.length) {
      var span = items[0].span || 1;
      res.push({slot: s, course: items[0], endMin: toMin(SLOT_TIMES[Math.min(s + span - 1, 4)].e)});
      for (var k = 1; k < span; k++) occ[s + k] = true;
    }
  }
  return res;
}
function buildDayTip() {
  var el = document.getElementById('dayTip');
  if (!el) return;
  var now = getNow();
  var dow = now.getDay() === 0 ? 7 : now.getDay();
  var grid = WEEK_COURSES[CURRENT_WEEK] || {};
  var today = getDayCourses(grid, dow);
  var nowMin = now.getHours() * 60 + now.getMinutes();
  var html = '';
  if (today.length === 0) {
    var nd = dow === 7 ? 1 : dow + 1;
    /* 周日的明天是下一周周一，跨周取数 */
    var ndGrid = (dow === 7) ? (WEEK_COURSES[CURRENT_WEEK + 1] || {}) : grid;
    var nc = getDayCourses(ndGrid, nd);
    html += '<span class="tip-emoji">🎉</span><div class="tip-body"><b>今天没有课，好好休息！</b>';
    if (nc.length) {
      var names = [];
      for (var i = 0; i < nc.length; i++) names.push('《' + nc[i].course.name + '》');
      html += '　明天 · ' + DAY_NAMES[nd] + ' 共 ' + nc.length + ' 节课<div class="tip-sub">' + SLOT_TIMES[nc[0].slot].s + ' 第一节：' + names[0] + '　·　明日课程：' + names.join('、') + '</div>';
    } else {
      html += '<div class="tip-sub">明天也没有课，享受悠闲时光～</div>';
    }
    html += '</div>';
  } else {
    var state = null, stateIdx = -1;
    for (var i = 0; i < today.length; i++) {
      var t = SLOT_TIMES[today[i].slot];
      if (nowMin >= toMin(t.s) && nowMin < today[i].endMin) { state = 'in'; stateIdx = i; break; }
    }
    var remain = 0;
    for (var i = 0; i < today.length; i++) {
      if (nowMin < today[i].endMin) remain++;
    }
    var lastEndMin = today[today.length-1].endMin;
    if (state === 'in') {
      var cc1 = today[stateIdx];
      var left1 = cc1.endMin - nowMin;
      html += '<span class="tip-emoji">🎓</span><div class="tip-body"><b>上课中</b> · ' + fmtDur(left1) + '后下课 —— 在' + (cc1.course.location || '教室') + '由' + cc1.course.teacher + '主讲《' + cc1.course.name + '》<div class="tip-sub">今日还剩 ' + remain + ' 节课</div></div>';
    } else if (nowMin < toMin(SLOT_TIMES[today[0].slot].s)) {
      var c2 = today[0];
      var left2 = toMin(SLOT_TIMES[c2.slot].s) - nowMin;
      html += '<span class="tip-emoji">🌅</span><div class="tip-body"><b>还没开始</b> · 距离第一节课还有 ' + fmtDur(left2) + ' ——《' + c2.course.name + '》在' + (c2.course.location || '教室') + '由' + c2.course.teacher + '主讲<div class="tip-sub">今日共 ' + today.length + ' 节课</div></div>';
    } else if (nowMin >= lastEndMin) {
      var nd = dow === 7 ? 1 : dow + 1;
      var ndGrid = (dow === 7) ? (WEEK_COURSES[CURRENT_WEEK + 1] || {}) : grid;
      var nc = getDayCourses(ndGrid, nd);
      html += '<span class="tip-emoji">🎉</span><div class="tip-body"><b>今日课程已全部完成</b>，辛苦了！';
      if (nc.length) {
        var names = [];
        for (var i = 0; i < nc.length; i++) names.push('《' + nc[i].course.name + '》');
        html += '　明天 · ' + DAY_NAMES[nd] + ' 共 ' + nc.length + ' 节课<div class="tip-sub">' + SLOT_TIMES[nc[0].slot].s + ' 第一节：' + names[0] + '　·　明日课程：' + names.join('、') + '</div>';
      } else {
        html += '<div class="tip-sub">明天没有课，好好休息～</div>';
      }
      html += '</div>';
    } else {
      var next = null;
      for (var i = 0; i < today.length; i++) {
        if (nowMin < toMin(SLOT_TIMES[today[i].slot].s)) { next = today[i]; break; }
      }
      if (next) {
        var left3 = toMin(SLOT_TIMES[next.slot].s) - nowMin;
        html += '<span class="tip-emoji">☕</span><div class="tip-body"><b>休息中</b> · ' + fmtDur(left3) + '后还有《' + next.course.name + '》课，在' + (next.course.location || '教室') + '由' + next.course.teacher + '主讲<div class="tip-sub">今日还剩 ' + remain + ' 节课</div></div>';
      }
    }
  }
  el.innerHTML = html;
}

function renderSchedule(week) {
  var badge = document.getElementById('weekBadge');
  badge.textContent = '第 ' + week + ' 周';
  if (week === CURRENT_WEEK) {
    badge.classList.remove('not-current');
  } else {
    badge.classList.add('not-current');
  }

  var now = getNow();
  var todayDow = now.getDay() === 0 ? 7 : now.getDay();
  var nowMin = now.getHours() * 60 + now.getMinutes();
  var isCurrentWeek = week === CURRENT_WEEK;
  for (var i = 1; i <= 7; i++) {
    var th = document.getElementById('th' + i);
    if (isCurrentWeek && i === todayDow) {
      th.classList.add('today');
      th.innerHTML = DAY_NAMES[i] + '<span class="today-tag">今日</span>';
    } else {
      th.classList.remove('today');
      th.innerHTML = DAY_NAMES[i];
    }
  }

  var grid = WEEK_COURSES[week] || {};
  var todayHasCourse = false;
  for (var s0 = 0; s0 < 5; s0++) { if ((grid[s0 + '_' + todayDow] || []).length > 0) { todayHasCourse = true; break; } }
  var todayCoursesNow = getDayCourses(grid, todayDow);
  var allDone = todayCoursesNow.length > 0 && todayCoursesNow.every(function(c){return nowMin >= c.endMin;});
  var refDay = (isCurrentWeek && (!todayHasCourse || allDone)) ? (todayDow === 7 ? 1 : todayDow + 1) : 0;
  if (isCurrentWeek && refDay) {
    var refTh = document.getElementById('th' + refDay);
    if (refTh && refTh.innerHTML.indexOf('ref-day-tag') < 0) {
      refTh.innerHTML += '<span class="ref-day-tag">参考日</span>';
    }
  }
  /* 周日的参考日跨周：周一列改用下一周数据渲染 */
  var refCrossWeek = (refDay === 1 && todayDow === 7);
  var refGrid = refCrossWeek ? (WEEK_COURSES[week + 1] || {}) : grid;
  var count = 0;
  var html = '';
  /* occupied[slot][wd] = true 表示被 rowspan 占用 */
  var occupied = {};
  for (var s = 0; s < 5; s++) { occupied[s] = {}; }

  for (var ni = 0; ni < NODES.length; ni++) {
    var node = NODES[ni];
    html += '<tr><td class="tc"><span class="tn">' + node.name + '</span>' + node.time + '</td>';
    for (var wd = 1; wd <= 7; wd++) {
      if (occupied[ni][wd]) continue; /* 被 rowspan 占用 */
      var key = ni + '_' + wd;
      var items = (refCrossWeek && wd === refDay) ? (refGrid[key] || []) : (grid[key] || []);
      if (items.length > 0) {
        var c = items[0];
        var span = c.span || 1;
        count++;
        var bg = COLORS[c.name] || '#3b82f6';
        var loc = c.location || '';
        var courseUrl = '/schedule/course.html?week=' + week + '&day=' + wd + '&slot=' + ni + '&name=' + encodeURIComponent(c.name) + '&teacher=' + encodeURIComponent(c.teacher) + '&location=' + encodeURIComponent(loc) + '&span=' + span;
        var isRef = (refDay && wd === refDay);
        var isLive = (isCurrentWeek && wd === todayDow && nowMin >= toMin(SLOT_TIMES[ni].s) && nowMin < toMin(SLOT_TIMES[Math.min(ni + span - 1, 4)].e));
        html += '<td rowspan="' + span + '"' + (isRef ? ' class="ref-col"' : '') + '><div class="cc' + (isLive ? ' live' : '') + '" style="background:linear-gradient(135deg,' + bg + 'dd,' + bg + '99);animation-delay:' + (ni * 0.06 + wd * 0.03) + 's;cursor:pointer" onclick="window.open(\'' + courseUrl + '\',\'_blank\')">'
          + (isLive ? '<div class="live-tag">进行中</div>' : '')
          + '<div class="cn">' + c.name + '</div>'
          + (loc ? '<div class="ci">📍 ' + loc + '</div>' : '')
          + '<div class="ci">👤 ' + c.teacher + '</div>'
          + (span > 1 ? '<div class="ci">⏱ 连上' + (span * 2) + '节</div>' : '')
          + '<div class="ci" style="margin-top:4px;font-size:10px;opacity:.7">📎 点击卡片可上传资料</div>'
          + '</div></td>';
        /* 标记被占用的后续行 */
        for (var k = 1; k < span; k++) {
          if (ni + k < 5) occupied[ni + k][wd] = true;
        }
      } else {
        html += '<td><div class="es"></div></td>';
      }
    }
    html += '</tr>';
  }
  document.getElementById('scheduleBody').innerHTML = html;
  document.getElementById('courseCount').textContent = count > 0 ? ('共 ' + count + ' 门课') : '本周无课';
  buildDayTip();

  /* rowspan 卡片撑满：等浏览器布局后再量高度 */
  requestAnimationFrame(function() {
    var cells = document.querySelectorAll('#scheduleBody td[rowspan]');
    for (var t = 0; t < cells.length; t++) {
      var card = cells[t].querySelector('.cc');
      if (card) card.style.minHeight = (cells[t].offsetHeight - 8) + 'px';
    }
  });
}

function loadCustomCourses(){
  fetch('/api/courses', {headers: {'X-Token': sessionStorage.getItem('admin_token') || ''}}).then(function(r){
    if (r.status === 401) throw new Error('unauthorized');
    return r.json();
  }).then(function(d){
    if (d && d.ok && d.courses && d.courses.length > 0) {
      for (var i = 0; i < d.courses.length; i++) {
        var c = d.courses[i];
        var slot = (c.start || 1) - 1;
        var span = c.span || 1;
        var weeks = c.weeks || [];
        for (var wi = 0; wi < weeks.length; wi++) {
          var w = weeks[wi];
          if (!WEEK_COURSES[w]) WEEK_COURSES[w] = {};
          var key = slot + '_' + c.weekday;
          if (!WEEK_COURSES[w][key]) WEEK_COURSES[w][key] = [];
          WEEK_COURSES[w][key].push({
            name: c.name,
            teacher: c.teacher || '',
            location: c.location || '',
            span: span
          });
        }
      }
      renderSchedule(currentWeek);
    }
  }).catch(function(){});
}

  if (!open) __simLabel();
}

    '<input type="date" id="simDate" style="width:100%;padding:6px 8px;border:1px solid rgba(0,0,0,.12);border-radius:8px;font-size:13px;margin-bottom:6px;background:#fff;box-sizing:border-box;">' +
    '<input type="time" id="simTime" style="width:100%;padding:6px 8px;border:1px solid rgba(0,0,0,.12);border-radius:8px;font-size:13px;margin-bottom:8px;background:#fff;box-sizing:border-box;">' +

    '</div><div id="simNow" style="font-size:11px;color:#94a3b8;margin-top:8px;text-align:center;"></div>';

  var t = new Date();

  document.getElementById('simDate').value = t.getFullYear() + '-' + p(t.getMonth()+1) + '-' + p(t.getDate());
  document.getElementById('simTime').value = p(t.getHours()) + ':' + p(t.getMinutes());
})();
